name: Common Diagnostics CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Common.Diagnostics.UnitTests/Common.Diagnostics.UnitTests.csproj

      - name: Build
        run: dotnet build Common.Diagnostics.UnitTests/Common.Diagnostics.UnitTests.csproj --no-restore --configuration Debug

      - name: Test
        run: dotnet test Common.Diagnostics.UnitTests/Common.Diagnostics.UnitTests.csproj --no-build --configuration Debug
